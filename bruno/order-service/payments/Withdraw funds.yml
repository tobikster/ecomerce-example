info:
  name: Withdraw funds
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL_PAYMENTS}}/accounts/:customer_id/withdraws"
  params:
    - name: customer_id
      value: customer_123
      type: path
  body:
    type: json
    data: |-
      {
        "amount": {{amount}},
        "currencyCode": "{{currency_code}}"
      }
  auth: inherit

runtime:
  variables:
    - name: amount
      value:
        type: number
        data: "100"
    - name: currency_code
      value: PLN

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
