pre-commit:
    parallel: true
    jobs:
        -   name: ktlint
            glob: "*.{kt,kts}"
            run: ktlint --format {staged_files}
            stage_fixed: true

        -   name: detekt
            glob: "*.{kt,kts}"
            run: FILES=$(echo "{staged_files}" | tr ' ' ','); detekt --build-upon-default-config --input "$FILES"

pre-push:
    parallel: true
    jobs:
        -   name: ktlint
            glob: "*.{kt,kts}"
            run: ./gradlew ktlintCheck --daemon

        -   name: detekt
            glob: "*.{kt,kts}"
            run: ./gradlew detekt --daemon
